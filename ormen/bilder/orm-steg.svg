<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#1a1a1a">Så kryper ormen: ett nytt huvud först, sedan bort med svansen</text>

  <!-- x-nummer -->
  <g text-anchor="middle" fill="#555555">
    <text x="60" y="68">7</text>
    <text x="100" y="68">8</text>
    <text x="140" y="68">9</text>
    <text x="180" y="68">10</text>
    <text x="220" y="68">11</text>
    <text x="260" y="68">12</text>
  </g>

  <!-- Rad 1: före -->
  <g stroke="#9a9a9a" stroke-width="1" fill="#eeeeee">
    <rect x="40" y="80" width="40" height="40"/>
    <rect x="200" y="80" width="40" height="40"/>
    <rect x="240" y="80" width="40" height="40"/>
  </g>
  <g stroke="#3d8a26" stroke-width="1.5" fill="#6cc04a">
    <rect x="80" y="80" width="40" height="40"/>
    <rect x="120" y="80" width="40" height="40"/>
  </g>
  <rect x="160" y="80" width="40" height="40" fill="#f5d84a" stroke="#b89a10" stroke-width="1.5"/>
  <text x="310" y="96" font-weight="600" fill="#1a1a1a">1. Före</text>
  <text x="310" y="116" font-family="Menlo, Consolas, monospace" fill="#1a1a1a">orm = [(10, 15), (9, 15), (8, 15)]</text>

  <!-- Rad 2: insert -->
  <g stroke="#9a9a9a" stroke-width="1" fill="#eeeeee">
    <rect x="40" y="190" width="40" height="40"/>
    <rect x="240" y="190" width="40" height="40"/>
  </g>
  <g stroke="#3d8a26" stroke-width="1.5" fill="#6cc04a">
    <rect x="80" y="190" width="40" height="40"/>
    <rect x="120" y="190" width="40" height="40"/>
    <rect x="160" y="190" width="40" height="40"/>
  </g>
  <rect x="200" y="190" width="40" height="40" fill="#f5d84a" stroke="#b89a10" stroke-width="3"/>
  <text x="220" y="250" text-anchor="middle" font-size="11.5" fill="#555555">nytt</text>
  <text x="310" y="206" font-weight="600" fill="#1a1a1a">2. orm.insert(0, nytt) lägger ett nytt huvud först</text>
  <text x="310" y="226" font-family="Menlo, Consolas, monospace" fill="#1a1a1a">orm = [(11, 15), (10, 15), (9, 15), (8, 15)]</text>

  <!-- Rad 3: pop -->
  <g stroke="#9a9a9a" stroke-width="1" fill="#eeeeee">
    <rect x="40" y="300" width="40" height="40"/>
    <rect x="240" y="300" width="40" height="40"/>
  </g>
  <rect x="80" y="300" width="40" height="40" fill="#eeeeee" stroke="#d9534f" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="100" y="360" text-anchor="middle" font-size="11.5" fill="#555555">borta</text>
  <g stroke="#3d8a26" stroke-width="1.5" fill="#6cc04a">
    <rect x="120" y="300" width="40" height="40"/>
    <rect x="160" y="300" width="40" height="40"/>
  </g>
  <rect x="200" y="300" width="40" height="40" fill="#f5d84a" stroke="#b89a10" stroke-width="1.5"/>
  <text x="310" y="316" font-weight="600" fill="#1a1a1a">3. orm.pop() tar bort den sista, svansen</text>
  <text x="310" y="336" font-family="Menlo, Consolas, monospace" fill="#1a1a1a">orm = [(11, 15), (10, 15), (9, 15)]</text>

  <text x="24" y="392" fill="#555555">Ormen är lika lång som förut, men har flyttat en ruta åt höger.</text>
  <text x="24" y="410" fill="#555555">Om den äter hoppar vi över steg 3, och då växer den.</text>
</svg>
